# §19 Alert rules (Prometheus format)
groups:
  - name: portcalls-slos
    rules:
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels: { severity: page }
      - alert: ElevatedErrorRate
        expr: rate(errors_total[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels: { severity: page }
      - alert: SharePointIntegrationFailing
        expr: increase(graph_api_errors_total[10m]) > 20
        labels: { severity: ticket }
      - alert: OutboxBacklog
        expr: outbox_unpublished_rows > 1000
        for: 15m
        labels: { severity: page }   # zero-loss risk (§19)
      - alert: LicenseExpiringSoon
        expr: license_days_remaining < 30
        labels: { severity: ticket }
